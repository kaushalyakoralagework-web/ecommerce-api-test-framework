[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Output
addopts =
    --html=reports/report.html
    --self-contained-html
    -v
    --tb=short
    --strict-markers

# Custom markers
markers =
    functional: functional tests against live API endpoints
    contract: schema and contract validation tests
    integration: end to end chained flow tests
    smoke: lightweight UI smoke tests via Playwright
    regression: full regression suite

# Logging
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(message)s
log_date_format = %Y-%m-%d %H:%M:%S